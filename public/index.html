<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PDF Forge</title>
</head>
<body>
  <h1>PDF Forge Demo</h1>
  <form id="f">
    <textarea name="text" rows="6" cols="60" placeholder="Type text here..."></textarea><br>
    <button>Render PDF</button>
  </form>

  <script>
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const text = new FormData(e.target).get('text');

      const res = await fetch('/render', {
        method:'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ text })
      });

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');  // open the generated PDF in new tab
    };
  </script>
</body>
</html>
